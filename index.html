<style>
/* One full-screen game canvas. A deliberate single dark look: dusk, olive, hazard amber. */
:root {
	--bg: #0f120e;
	--panel: #1a1f18;
	--fg: #f3f0e2;
	--muted: #9ea392;
	--accent: #f4a53a;
	--danger: #e5533f;
	--display: 'Impact', 'Haettenschweiler', 'Arial Narrow Bold', 'Arial Black', sans-serif;
	--body: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
	color-scheme: dark;
}
html {
	box-sizing: border-box;
	position: fixed; inset: 0;
	height: 100%;
	background: var(--bg);
	overflow: hidden;
	overscroll-behavior: none;
}
*, *::before, *::after { box-sizing: inherit; }
body {
	position: fixed; inset: 0;
	height: 100%;
	margin: 0;
	background: var(--bg);
	color: var(--fg);
	font-family: var(--body);
	overflow: hidden;
	overscroll-behavior: none;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
}
#wrap { position: relative; width: 100%; height: 100%; overflow: hidden; }
#canvas {
	position: absolute; left: 0; top: 0;
	display: block; width: 100%; height: 100%;
	outline: none; touch-action: none;
}
#safe-probe {
	position: fixed; visibility: hidden; pointer-events: none;
	padding-top: env(safe-area-inset-top, 0px);
	padding-left: env(safe-area-inset-left, 0px);
	padding-right: env(safe-area-inset-right, 0px);
	padding-bottom: env(safe-area-inset-bottom, 0px);
}
#status {
	position: absolute; inset: 0;
	display: flex; flex-direction: column; align-items: center; justify-content: center;
	gap: 18px; padding: 24px;
	background:
		radial-gradient(120% 80% at 50% 110%, rgba(244, 165, 58, 0.16), transparent 60%),
		var(--bg);
	transition: opacity 0.35s ease;
}
#status h1 {
	margin: 0;
	font-family: var(--display);
	font-weight: 400;
	font-size: clamp(30px, 8vw, 54px);
	letter-spacing: 0.04em;
	line-height: 1;
	text-align: center;
	text-wrap: balance;
}
#status h1 span { color: var(--accent); }
#status p { margin: 0; color: var(--muted); font-size: 15px; letter-spacing: 0.02em; }
#bar {
	width: min(320px, 70vw); height: 10px;
	border-radius: 999px; background: var(--panel);
	box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
	overflow: hidden;
}
#bar i {
	display: block; height: 100%; width: 4%;
	border-radius: inherit;
	background: repeating-linear-gradient(-45deg, var(--accent) 0 10px, #e0912c 10px 20px);
	transition: width 0.2s ease;
}
#pct { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--fg); }
#notice {
	display: none; max-width: 420px;
	padding: 14px 16px; border-radius: 12px;
	background: rgba(229, 83, 63, 0.12); border: 1px solid rgba(229, 83, 63, 0.55);
	color: var(--fg); font-size: 15px; line-height: 1.4; text-align: center;
}
#start {
	margin-top: 6px;
	min-width: 240px; min-height: 64px; padding: 0 28px;
	border: 0; border-radius: 18px;
	background: var(--accent); color: #1f1405;
	font-family: var(--display); font-size: 26px; letter-spacing: 0.06em;
	box-shadow: 0 0 0 0 rgba(244, 165, 58, 0.5);
	animation: zdpulse 1.6s ease-in-out infinite;
	cursor: pointer;
}
/* First run in Safari: how to install it. Hidden when running installed. */
#hint {
	display: none;
	position: absolute; left: 50%; transform: translateX(-50%);
	bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
	width: min(360px, calc(100% - 32px));
	align-items: center; gap: 12px;
	padding: 10px 6px 10px 16px; border-radius: 16px;
	background: rgba(26, 31, 24, 0.94);
	box-shadow: 0 0 0 1px rgba(244, 165, 58, 0.45), 0 8px 24px rgba(0, 0, 0, 0.45);
	font-size: 15px; line-height: 1.35; color: var(--fg); text-align: left;
}
#hint b { color: var(--accent); font-weight: 700; }
#hint svg { flex: none; width: 26px; height: 26px; }
#hint span { flex: 1; }
#hint button {
	flex: none; width: 44px; height: 44px; border: 0; border-radius: 12px;
	background: transparent; color: var(--muted); font-size: 26px; line-height: 1; cursor: pointer;
}
@keyframes zdpulse { 50% { box-shadow: 0 0 0 14px rgba(244, 165, 58, 0); } }
@media (prefers-reduced-motion: reduce) { #bar i, #status { transition: none; } #start { animation: none; } }
</style>
</head>
<body>
<div id="wrap">
	<canvas id="canvas" tabindex="0">Your browser does not support the canvas tag.</canvas>
	<div id="status">
		<h1>ZOMBIE <span>DEFENCE</span></h1>
		<div id="bar"><i id="fill"></i></div>
		<p><span id="pct">0%</span> &nbsp;loading the bunker</p>
		<div id="notice"></div>
		<div id="hint" role="note">
			<svg viewBox="0 0 24 24" fill="none" stroke="#f4a53a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>
			<span>Play full screen: tap <b>Share</b>, then <b>Add to Home Screen</b>.</span>
			<button id="hint-close" aria-label="Close">&times;</button>
		</div>
	</div>
	<div id="safe-probe"></div>
</div>

<script>
// Canvas size: CSS size x device pixel ratio, capped at 2 for phone GPUs.
// Installed on an iPhone the page runs under the status bar and above the
// home bar: zdSafe() gives the game all four insets so its HUD keeps clear.
(function () {
	const wrap = document.getElementById('wrap');
	const canvas = document.getElementById('canvas');
	const probe = document.getElementById('safe-probe');
	const CAP = 2;
	function ratio() { return Math.min(window.devicePixelRatio || 1, CAP); }
	window.zdUiScale = ratio();
	window.zdSafe = function () {
		const cs = getComputedStyle(probe);
		return [parseFloat(cs.paddingLeft) || 0, parseFloat(cs.paddingTop) || 0, parseFloat(cs.paddingRight) || 0, parseFloat(cs.paddingBottom) || 0];
	};
	function fit() {
		const r = wrap.getBoundingClientRect();
		const s = ratio();
		window.zdUiScale = s;
		const w = Math.max(1, Math.round(r.width * s));
		const h = Math.max(1, Math.round(r.height * s));
		if (canvas.width !== w || canvas.height !== h) {
			canvas.width = w;
			canvas.height = h;
		}
	}
	if ('ResizeObserver' in window) new ResizeObserver(fit).observe(wrap);
	window.addEventListener('resize', fit);
	window.addEventListener('orientationchange', function () { setTimeout(fit, 250); });
	fit();
	// No page zoom, no rubber-band scrolling, no long-press menus.
	['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
		document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
	});
	document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
	document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
})();
</script>
<script>
// First run in Safari (not installed): how to put it on the Home Screen.
// Shown on the loading screen for the first few launches until closed.
(function () {
	const standalone = window.navigator.standalone === true ||
		window.matchMedia('(display-mode: standalone)').matches ||
		window.matchMedia('(display-mode: fullscreen)').matches;
	window.zdStandalone = standalone;
	if (standalone) return;
	const ua = navigator.userAgent || '';
	const ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
	if (!ios) return;
	let n = 0;
	try {
		if (localStorage.getItem('zd-hint-closed') === '1') return;
		n = parseInt(localStorage.getItem('zd-hint-runs') || '0', 10) || 0;
		localStorage.setItem('zd-hint-runs', String(n + 1));
	} catch (e) {}
	if (n >= 3) return;
	const hint = document.getElementById('hint');
	hint.style.display = 'flex';
	document.getElementById('hint-close').addEventListener('click', function (e) {
		e.stopPropagation();
		hint.style.display = 'none';
		try { localStorage.setItem('zd-hint-closed', '1'); } catch (err) {}
	});
	// Taps on the hint don't count as TAP TO START.
	hint.addEventListener('touchend', function (e) { e.stopPropagation(); });
	hint.addEventListener('click', function (e) { e.stopPropagation(); });
})();
</script>
<script>
// Sound on iPhones (and inside the artifact frame or an app's web view):
//  - play through the silent switch (audioSession "playback", Safari 16.4+);
//  - catch the engine's AudioContext and resume it from a real tap (Godot's
//    own first-input unlock may never see a gesture in here), keep trying on
//    every tap until it runs, and after coming back to the tab;
//  - note any failure so the in-game sound settings can show it.
(function () {
	const info = { err: '', session: 'n/a', ctxs: [] };
	window.zdAudio = info;
	function setSession() {
		try {
			if (navigator.audioSession) {
				if (navigator.audioSession.type !== 'playback') navigator.audioSession.type = 'playback';
				info.session = navigator.audioSession.type;
			}
		} catch (e) { info.err = 'audioSession: ' + (e && e.message || e); }
	}
	setSession();
	const Orig = window.AudioContext || window.webkitAudioContext;
	if (Orig) {
		const Patched = function (opts) {
			const c = opts ? new Orig(opts) : new Orig();
			info.ctxs.push(c);
			return c;
		};
		Patched.prototype = Orig.prototype;
		try { Object.setPrototypeOf(Patched, Orig); } catch (e) {}
		window.AudioContext = Patched;
		if (window.webkitAudioContext) window.webkitAudioContext = Patched;
	}
	if (window.AudioWorklet && AudioWorklet.prototype.addModule) {
		const add = AudioWorklet.prototype.addModule;
		AudioWorklet.prototype.addModule = function (url, opts) {
			return add.call(this, url, opts).catch(function (e) {
				info.err = 'worklet ' + String(url).split('/').pop() + ': ' + (e && e.message || e);
				throw e;
			});
		};
	}
	function running() {
		return info.ctxs.length > 0 && info.ctxs.every(function (c) { return c.state === 'running' || c.state === 'closed'; });
	}
	function kick() {
		setSession();
		info.ctxs.forEach(function (c) {
			if (c.state === 'closed') return;
			if (c.state !== 'running') {
				try { c.resume().catch(function (e) { info.err = 'resume: ' + (e && e.message || e); }); }
				catch (e) { info.err = 'resume: ' + (e && e.message || e); }
			}
			try {
				const b = c.createBuffer(1, 1, 22050);
				const src = c.createBufferSource();
				src.buffer = b;
				src.connect(c.destination);
				src.start(0);
			} catch (e) {}
		});
	}
	['touchend', 'pointerup', 'click', 'keydown'].forEach(function (t) {
		document.addEventListener(t, function () { if (!running()) kick(); }, true);
	});
	document.addEventListener('visibilitychange', function () { if (!document.hidden) kick(); });
	window.zdAudioKick = kick;
	window.zdAudioInfo = function () {
		const c = info.ctxs[0];
		return JSON.stringify({ state: c ? c.state : 'none', rate: c ? c.sampleRate : 0, session: info.session, err: info.err, n: info.ctxs.length });
	};
})();
</script>
<script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":37001516,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const status = document.getElementById('status');
	const fill = document.getElementById('fill');
	const pct = document.getElementById('pct');
	const notice = document.getElementById('notice');
	let done = false;

	function fail(err) {
		console.error(err);
		const msg = err instanceof Error ? err.message : (typeof err === 'string' ? err : 'Something went wrong while starting the game.');
		notice.textContent = msg;
		notice.style.display = 'block';
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail('This browser is missing: ' + missing.join(', '));
		return;
	}
	engine.startGame({
		onProgress: function (current, total) {
			if (done) return;
			if (current > 0 && total > 0) {
				const p = Math.min(100, Math.round((current / total) * 100));
				fill.style.width = Math.max(4, p) + '%';
				pct.textContent = p + '%';
			}
		},
	}).then(function () {
		done = true;
		fill.style.width = '100%';
		pct.textContent = '100%';
		// One real tap starts the sound (iOS needs it inside a gesture).
		document.getElementById('bar').style.display = 'none';
		const p = status.querySelector('p');
		p.innerHTML = '';
		const btn = document.createElement('button');
		btn.id = 'start';
		btn.textContent = 'TAP TO START';
		status.insertBefore(btn, document.getElementById('hint'));
		let gone = false;
		function go(e) {
			if (gone) return;
			gone = true;
			if (e) e.preventDefault();
			if (window.zdAudioKick) window.zdAudioKick();
			status.style.opacity = '0';
			setTimeout(function () { status.remove(); }, 350);
		}
		status.addEventListener('touchend', go);
		status.addEventListener('click', go);
	}, fail);
})();
</script>
</body>
